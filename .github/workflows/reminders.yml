# 會議提醒信（spec §9.3 / C7）
#
# 免費方案沒有排程器，所以用 GitHub Actions 的 schedule 呼叫一個受密碼保護的端點。
# 端點本身是冪等的：重複呼叫不會重複寄信。
#
# 已知限制（SETUP.md 也有說明）：GitHub 的排程在系統忙碌時可能延遲數分鐘，
# 而且「儲存庫連續 60 天沒有任何動作」時會自動停用排程。
# 管理後台會顯示「提醒信工作最後執行時間」，方便及早發現。
name: Reminders

on:
  schedule:
    # 每 15 分鐘一次。
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    name: 呼叫提醒信端點
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 呼叫 /api/cron/send-reminders
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "ERROR: 缺少 Secret：APP_BASE_URL 或 CRON_SECRET" >&2
            exit 1
          fi

          # Render 免費方案閒置 15 分鐘後會休眠，喚醒約需 60 秒，
          # 所以逾時設得比較寬鬆，並且會重試。
          curl -fsS -X POST "${APP_BASE_URL%/}/api/cron/send-reminders" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Length: 0" \
            --max-time 120 \
            --retry 3 \
            --retry-delay 20 \
            --retry-connrefused \
            --retry-all-errors \
            -o response.json \
            -w '\nHTTP 狀態：%{http_code}\n'

          echo "回應內容："
          cat response.json
